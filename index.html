    <style>
      :focus-visible {
        outline: 2px solid #ED702E;
        outline-offset: 2px;
        border-radius: 8px;
      }
      
      /* New Base Styles from UI Spec */
      body {
        background-color: #FBFBFA; /* Perplexity-like warm off-white */
        color: #1A1A1A; /* Slightly softer black for text */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      }

      .shadow-soft {
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      }
      .shadow-elevated {
        box-shadow: 0 10px 15px -3px rgba(30, 41, 59, 0.07), 0 4px 6px -4px rgba(30, 41, 59, 0.07);
      }
      .shadow-floating {
        box-shadow: 0 25px 50px -12px rgba(30, 41, 59, 0.15);
      }
      
      .text-gradient-primary {
        color: #ED702E;
      }

      .btn-premium {
         background-color: #ED702E;
         color: #ffffff;
      }
      .btn-premium:hover {
        background-color: #D46124;
      }

      /* Animations from UI Spec */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      @keyframes revealUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-reveal-up { animation: revealUp 0.6s ease-out backwards; }
      @keyframes revealScale {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-reveal-scale { animation: revealScale 0.4s ease-out forwards; }


      /* Old Toast Animation */
      @keyframes toast-in {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-toast-in {
        animation: toast-in 0.5s cubic-bezier(0.21, 1.02, 0.73, 1) forwards;
      }
      /* Underline Animation for Links */
      .animated-underline {
        position: relative;
        text-decoration: none;
      }
      .animated-underline::after {
        content: '';
        position: absolute;
        width: 100%;
        transform: scaleX(0);
        height: 2px;
        bottom: -3px;
        left: 0;
        background-color: #ED702E;
        transform-origin: bottom right;
        transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
      }
      .animated-underline:hover::after {
        transform: scaleX(1);
        transform-origin: bottom left;
      }
      
      /* Print-specific styles for PDF export */
      @media print {
        @page {
          size: A4;
          margin: 1.5cm;
        }
        body {
          background-image: none !important;
          background-color: #fff !important; /* Ensure white background for PDF */
        }
        body * {
          visibility: hidden;
        }
        .printable-area, .printable-area * {
          visibility: visible;
        }
        .printable-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 0;
          border: none !important;
          box-shadow: none !important;
          background: #fff !important;
        }
        a, a:visited {
          text-decoration: underline;
          color: #000 !important;
        }
        .no-print, .no-print * {
          display: none !important;
        }
      }
      /* Floating Action Button Animation */
      @keyframes plus-one {
        from {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
        to {
          transform: translateY(-60px) scale(1.5);
          opacity: 0;
        }
      }
      .animate-plus-one {
        animation: plus-one 0.8s ease-out forwards;
      }
      /* Radar Sweep Animation */
      @keyframes radar-sweep {
        from {
          transform-origin: center;
          transform: rotate(0deg);
        }
        to {
          transform-origin: center;
          transform: rotate(360deg);
        }
      }
      .radar-sweep {
        animation: radar-sweep 3s linear infinite;
      }
      :focus-visible { outline: 2px solid #292524; outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
      }
    </style>
